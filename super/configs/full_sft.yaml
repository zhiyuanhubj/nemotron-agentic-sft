# Editable baseline for full-parameter text/tool SFT. Configure topology for your hardware.
recipe: FinetuneRecipeForVLM
seed: 42
step_scheduler:
  num_epochs: 3
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 100
  log_remote_every_steps: 1
  gc_every_steps: 5
dist_env:
  backend: nccl
  timeout_minutes: 120
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: ${LOCAL_MODEL}
  trust_remote_code: true
  torch_dtype: torch.bfloat16
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm
    dispatcher: torch
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: ${LOCAL_MODEL}
  trust_remote_code: true
  local_files_only: true
checkpoint:
  enabled: true
  checkpoint_dir: ${LOCAL_CKPT_DIR}
  model_cache_dir: ${LOCAL_MODEL}
  model_save_format: safetensors
  save_consolidated: false
  max_recent_checkpoints: 2
  v4_compatible: true
  consolidation_timeout_minutes: 120
  is_async: false
distributed:
  strategy: fsdp2
  dp_size: null
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
freeze_config:
  freeze_embeddings: false
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false
dataset:
  _target_: agent_sft_data.PretokenizedDatasetConfig
  path: ${LOCAL_DATA}/train
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  shuffle: true
  drop_last: false
  collate_fn:
    _target_: agent_sft_data.collate_fn
    max_length: 8192
validation_dataset:
  _target_: agent_sft_data.PretokenizedDatasetConfig
  path: ${LOCAL_DATA}/validation
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  shuffle: false
  drop_last: false
  collate_fn:
    _target_: agent_sft_data.collate_fn
    max_length: 8192
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  lr: 1.0e-05
  weight_decay: 0.1
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 10
  min_lr: 1.0e-06
clip_grad_norm:
  max_norm: 1.0
wandb:
  entity: ${WANDB_ENTITY}
  project: nemotron35-super-sft
  name: ${RUN_NAME}
  id: ${RUN_NAME}
  resume: allow
  dir: ${LOCAL_WANDB}
  tags: [full_sft, native_template, rolling_long_context, independent_validation]
early_stopping:
  min_steps: 20
  relative_val_increase: 0.1
  consecutive_evals: 5
  train_loss_drop: 0.05
  train_window: 10
prepared_data_gate: ${LOCAL_DATA}/READY.json
token_budget:
  enabled: true
  mode: track_only
