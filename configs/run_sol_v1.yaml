# Clean Sol-thinking LoRA run. Never resume this from the prior `all` run:
# that checkpoint carried a scheduler whose LR stayed at 1e-5.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  num_epochs: 8
  max_steps: 192
  global_batch_size: 32
  local_batch_size: 1
  ckpt_every_steps: 12
  val_every_steps: 6

dist_env:
  backend: nccl
  timeout_minutes: 120

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ${NEMOTRON_MODEL}
  num_nextn_predict_layers: 2
  mtp_use_repeated_layer: true
  mtp_loss_scaling_factor: 0.1
  output_hidden_states: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: gmm
    dispatcher: torch
    fake_balanced_gate: false
    enable_fsdp_optimizations: false

checkpoint:
  enabled: true
  checkpoint_dir: ${CKPT_DIR}/run_sol_v1/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 8
  pp_size: 1
  ep_size: 32
  activation_checkpointing: true
  defer_fsdp_grad_sync: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules: ["*.out_proj"]
  dim: 32
  alpha: 32
  use_triton: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.pretok_jsonl.PretokenizedJsonl
  path_or_dataset_id: ${DATA_DIR}/sol_v1_balanced_train_tok.jsonl
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 128
  shuffle: true
  drop_last: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.pretok_jsonl.PretokenizedJsonl
  path_or_dataset_id: ${DATA_DIR}/sol_v1_balanced_val_tok.jsonl
  split: train

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 128
  shuffle: false
  drop_last: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 6
  min_lr: 1.0e-5

ci:
  recipe_owner: zhiyuan
  time: "12:00:00"
  nodes: 4
